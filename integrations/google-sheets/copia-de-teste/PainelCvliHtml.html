<!doctype html>
<html lang="pt-BR">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      :root {
        --tinta: #10161f;
        --azul: #123a6b;
        --azul-claro: #d7e4f4;
        --borda: #0f2a4a;
        --rosa: #f0d3ce;
        --papel: #ffffff;
        --fundo: #eceff3;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 18px;
        background: var(--fundo);
        color: var(--tinta);
        font-family: Arial, Helvetica, sans-serif;
      }

      .barra {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        max-width: 1040px;
        margin: 0 auto 12px;
      }

      .atualizado { color: #5b6673; font-size: 12px; }
      .acoes { display: flex; gap: 8px; }

      button {
        min-height: 34px;
        padding: 0 16px;
        border: 1px solid #9aa5b1;
        border-radius: 6px;
        background: #fff;
        color: var(--tinta);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      button.verde {
        border-color: #1b6b45;
        background: #1b6b45;
        color: #fff;
      }

      button.verde:hover { background: #17593a; }

      button.primary {
        border-color: var(--azul);
        background: var(--azul);
        color: #fff;
      }

      button:disabled { opacity: 0.6; cursor: wait; }

      /* O quadro reproduz o cabeçalho impresso da planilha: faixa preta com o
         brasão dos dois lados, faixa azul com o título e a tabela emoldurada. */
      .quadro {
        max-width: 1040px;
        margin: 0 auto;
        border: 2px solid var(--borda);
        background: var(--papel);
      }

      .brasao-faixa {
        display: grid;
        grid-template-columns: 116px 1fr 116px;
        align-items: center;
        padding: 10px 14px;
        background: #000;
        border-bottom: 2px solid var(--borda);
      }

      /* O brasão vem do próprio SIPI. Embutir a imagem em base64 deixaria o
         arquivo com 126 KB, ruim de colar no editor do Apps Script. */
      .brasao {
        display: block;
        width: 92px;
        height: 74px;
        margin: 0 auto;
        background-image: url("https://sipi-dt-itabela.sipi-dt-itabela.workers.dev/sipi-badge.png");
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;
      }

      .brasao-faixa h1 {
        margin: 0;
        color: #fff;
        font-size: 26px;
        font-weight: 700;
        line-height: 1.25;
        text-align: center;
      }

      .brasao-faixa h1 span { display: block; font-size: 20px; }

      .titulo-faixa {
        padding: 7px 10px;
        border-bottom: 2px solid var(--borda);
        background: var(--azul-claro);
        color: var(--azul);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-align: center;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th, td {
        border: 1px solid var(--borda);
        padding: 6px 4px;
        font-size: 14px;
        text-align: center;
        color: var(--azul);
      }

      thead th {
        background: var(--papel);
        color: var(--tinta);
        font-weight: 700;
      }

      th.mes {
        width: 132px;
        font-size: 15px;
      }

      td.mes {
        text-align: left;
        padding-left: 10px;
        color: var(--tinta);
      }

      tbody tr.total td {
        background: var(--rosa);
        color: var(--tinta);
        font-weight: 700;
      }

      tbody tr.taxa td {
        background: var(--rosa);
        color: var(--tinta);
        font-weight: 700;
      }

      tbody tr.total td.mes,
      tbody tr.taxa td.mes { padding-left: 10px; }


      /* ---------------- Relatório para impressão ----------------
         Fica fora da tela e só aparece ao imprimir. O cabeçalho repete o das
         fichas do SIPI: brasão, órgão, título e faixa de uso restrito. */
      .relatorio { display: none; }

      @media print {
        @page { size: A4 portrait; margin: 12mm 12mm 14mm; }

        /* Sem isto o Chrome imprime sem fundo: some o brasao, a faixa azul e o rosa. */
        * { print-color-adjust: exact; -webkit-print-color-adjust: exact; }

        body { background: #fff; padding: 0; }
        .barra, .quadro { display: none !important; }
        .relatorio { display: block; color: #10161f; }

        .rel-masthead {
          display: grid;
          grid-template-columns: 22mm minmax(0, 1fr) 46mm;
          align-items: center;
          gap: 6mm;
          padding: 4mm 0;
          border-top: 2mm solid var(--azul);
          border-bottom: 1px solid #b9c6d6;
        }

        .rel-brasao { display: block; width: 22mm; height: auto; }

        .rel-orgao {
          margin: 0 0 1mm;
          color: var(--azul);
          font-size: 8pt;
          font-weight: 800;
          letter-spacing: 0.16em;
          text-transform: uppercase;
        }

        .rel-masthead h1 { margin: 0; font-size: 17pt; font-weight: 800; }
        .rel-masthead p { margin: 1mm 0 0; color: #3b4657; font-size: 9pt; }
        .rel-masthead small { display: block; margin-top: 1mm; color: #6b7686; font-size: 7pt; }

        .rel-id {
          padding: 3mm;
          border: 1px solid #9aa8ba;
          border-radius: 2mm;
          text-align: right;
        }

        .rel-id span, .rel-id small {
          display: block;
          color: #4a5568;
          font-size: 7pt;
          letter-spacing: 0.1em;
          text-transform: uppercase;
        }

        .rel-id strong { display: block; margin: 1mm 0; font-size: 13pt; }

        .rel-faixa {
          display: flex;
          justify-content: space-between;
          margin: 3mm 0 5mm;
          padding: 1.6mm 3mm;
          border: 1px solid #b9c6d6;
          border-left: 1.4mm solid var(--azul);
          background: var(--azul-claro);
          color: #3b4657;
          font-size: 7pt;
          letter-spacing: 0.12em;
          text-transform: uppercase;
        }

        .relatorio h2 {
          margin: 0 0 2.5mm;
          padding-bottom: 1.5mm;
          border-bottom: 1px solid #cdd8e5;
          font-size: 11pt;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: var(--azul);
        }

        .rel-cartoes {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 3mm;
          margin-bottom: 6mm;
        }

        .rel-cartao {
          padding: 3mm;
          border: 1px solid #b9c6d6;
          border-top: 1.4mm solid var(--azul);
          text-align: center;
        }

        .rel-cartao span { display: block; font-size: 8pt; letter-spacing: 0.1em; color: #4a5568; }
        .rel-cartao strong { display: block; margin: 1mm 0; font-size: 20pt; color: var(--azul); }
        .rel-cartao small { display: block; font-size: 8pt; color: #3b4657; }

        .rel-texto { margin-bottom: 6mm; }
        .rel-texto p { margin: 0 0 2.5mm; font-size: 10pt; line-height: 1.55; text-align: justify; }
        .rel-texto h3 { margin: 4mm 0 1.5mm; font-size: 10pt; color: var(--azul); }

        .rel-assinatura {
          margin-top: 12mm;
          padding-top: 2mm;
          border-top: 1px solid #10161f;
          width: 70mm;
          text-align: center;
          font-size: 8pt;
        }

        .rel-folha2 { break-before: page; page-break-before: always; padding-top: 4mm; }

        .rel-folha2 table { margin-top: 3mm; }
        .rel-folha2 th, .rel-folha2 td { font-size: 9pt; padding: 2mm 1mm; }
        .rel-folha2 .legenda { margin-top: 3mm; font-size: 8pt; color: #4a5568; }
      }

      .aviso {
        padding: 40px 20px;
        text-align: center;
        color: #5b6673;
        font-size: 14px;
      }

      .aviso.erro { color: #8f2318; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="barra">
      <span class="atualizado" id="updated">Carregando dados atualizados...</span>
      <span class="acoes">
        <button type="button" onclick="google.script.host.close()">Fechar</button>
        <button type="button" class="verde" id="imprimir" onclick="window.print()">Imprimir relatório</button>
        <button class="primary" id="refresh" type="button" onclick="carregar()">Atualizar</button>
      </span>
    </div>

    <div class="quadro">
      <div class="brasao-faixa">
        <span class="brasao" aria-hidden="true"></span>
        <h1>POLÍCIA CIVIL<span>Delegacia Territorial de Itabela</span></h1>
        <span class="brasao" aria-hidden="true"></span>
      </div>
      <div class="titulo-faixa">CVLI'S COMPARATIVO</div>
      <div id="content" class="aviso">Atualizando resumo...</div>
    </div>

    <section class="relatorio" id="relatorio"></section>

    <script>
      function escapar(value) {
        const node = document.createElement("span");
        node.textContent = value == null ? "" : String(value);
        return node.innerHTML;
      }

      function ehTaxa(label) {
        return label.indexOf("Elucida") >= 0 && label.indexOf("%") >= 0;
      }

      function renderizar(payload) {
        const linhas = payload.valores || [];
        if (linhas.length < 3) throw new Error("Dashboard sem dados suficientes.");

        // A primeira linha traz os anos em células mescladas: só a primeira das
        // duas colunas do ano tem texto.
        const anos = [];
        for (let col = 1; col < linhas[0].length; col += 2) {
          anos.push(String(linhas[0][col] || "").trim());
        }

        const metricas = linhas[1];
        const corpo = linhas.slice(2);

        const cabecalho =
          "<thead>" +
          "<tr>" +
          '<th class="mes" rowspan="2">' + escapar(linhas[0][0] || "MÊS") + "</th>" +
          anos.map((ano) => '<th colspan="2">' + escapar(ano) + "</th>").join("") +
          "</tr>" +
          "<tr>" +
          anos
            .map((ano, indice) => {
              const registros = metricas[1 + indice * 2] || "Registros";
              const elucidados = metricas[2 + indice * 2] || "Elucidados";
              return "<th>" + escapar(registros) + "</th><th>" + escapar(elucidados) + "</th>";
            })
            .join("") +
          "</tr>" +
          "</thead>";

        const conteudo = corpo
          .map((linha) => {
            const rotulo = String(linha[0] || "");
            if (!rotulo && linha.every((item) => !String(item || "").trim())) return "";

            if (ehTaxa(rotulo)) {
              // A porcentagem vale para o ano inteiro: ocupa as duas colunas.
              const celulas = anos
                .map((ano, indice) => '<td colspan="2">' + escapar(linha[1 + indice * 2]) + "</td>")
                .join("");
              return '<tr class="taxa"><td class="mes">' + escapar(rotulo) + "</td>" + celulas + "</tr>";
            }

            const classe = rotulo.toUpperCase() === "TOTAL" ? "total" : "";
            const celulas = linha
              .slice(1)
              .map((item) => "<td>" + escapar(item) + "</td>")
              .join("");
            return '<tr class="' + classe + '"><td class="mes">' + escapar(rotulo) + "</td>" + celulas + "</tr>";
          })
          .join("");

        const tabela = "<table>" + cabecalho + "<tbody>" + conteudo + "</tbody></table>";
        const alvo = document.getElementById("content");
        alvo.className = "";
        alvo.innerHTML = tabela;
        montarRelatorio(payload, anos, tabela);
        document.getElementById("updated").textContent = "Atualizado em " + payload.atualizadoEm;
        document.getElementById("refresh").disabled = false;
      }


      const MESES_INDICE = 2; // as linhas de mês começam aqui dentro de "valores"

      function numero(valor) {
        const limpo = String(valor == null ? "" : valor).replace(/[^0-9-]/g, "");
        return limpo ? Number(limpo) : 0;
      }

      function plural(quantidade, singular, pluralPalavra) {
        return quantidade === 1 ? singular : pluralPalavra;
      }

      /** Junta por ano o que a planilha traz espalhado em colunas. */
      function resumirPorAno(linhas, anos) {
        const meses = linhas.slice(MESES_INDICE).filter((linha) => {
          const rotulo = String(linha[0] || "").toUpperCase();
          return rotulo && rotulo !== "TOTAL" && rotulo.indexOf("ELUCIDA") < 0;
        });

        return anos.map((ano, indice) => {
          const colunaRegistros = 1 + indice * 2;
          const colunaElucidados = 2 + indice * 2;
          let registros = 0;
          let elucidados = 0;
          let picoMes = "";
          let picoValor = 0;

          meses.forEach((linha) => {
            const doMes = numero(linha[colunaRegistros]);
            registros += doMes;
            elucidados += numero(linha[colunaElucidados]);
            if (doMes > picoValor) {
              picoValor = doMes;
              picoMes = String(linha[0] || "");
            }
          });

          const taxa = registros ? Math.round((elucidados / registros) * 100) : 0;
          return { ano, registros, elucidados, taxa, picoMes, picoValor };
        });
      }

      function frasePorAno(atual, anterior) {
        const partes = [];
        partes.push(
          "Em " + atual.ano + " foram registrados " + atual.registros + " " +
          plural(atual.registros, "crime violento letal intencional", "crimes violentos letais intencionais") +
          ", com " + atual.elucidados + " " + plural(atual.elucidados, "elucidado", "elucidados") +
          " — taxa de elucidação de " + atual.taxa + "%."
        );

        if (atual.picoValor > 0) {
          partes.push(
            "O mês de maior incidência foi " + atual.picoMes + ", com " + atual.picoValor + " " +
            plural(atual.picoValor, "registro", "registros") + "."
          );
        }

        if (anterior && anterior.registros > 0) {
          const diferenca = atual.registros - anterior.registros;
          const percentual = Math.round(Math.abs(diferenca / anterior.registros) * 100);
          if (diferenca === 0) {
            partes.push("O total se manteve igual ao de " + anterior.ano + ".");
          } else {
            partes.push(
              (diferenca > 0 ? "Houve aumento de " : "Houve redução de ") + Math.abs(diferenca) + " " +
              plural(Math.abs(diferenca), "registro", "registros") + " (" + percentual + "%) em relação a " +
              anterior.ano + "."
            );
          }
        }

        return partes.join(" ");
      }

      function montarRelatorio(payload, anos, tabelaHtml) {
        const resumo = resumirPorAno(payload.valores, anos);
        const totalRegistros = resumo.reduce((soma, item) => soma + item.registros, 0);
        const totalElucidados = resumo.reduce((soma, item) => soma + item.elucidados, 0);
        const taxaGeral = totalRegistros ? Math.round((totalElucidados / totalRegistros) * 100) : 0;
        const periodo = anos.length ? anos[0] + " a " + anos[anos.length - 1] : "";

        const cartoes = resumo
          .map((item) =>
            '<div class="rel-cartao"><span>' + escapar(item.ano) + "</span><strong>" +
            item.registros + "</strong><small>" + item.elucidados + " elucidados · " +
            item.taxa + "%</small></div>"
          )
          .join("");

        const paragrafos = resumo
          .map((item, indice) =>
            "<h3>" + escapar(item.ano) + "</h3><p>" + escapar(frasePorAno(item, resumo[indice - 1])) + "</p>"
          )
          .join("");

        document.getElementById("relatorio").innerHTML =
          '<header class="rel-masthead">' +
          '<img class="rel-brasao" src="https://sipi-dt-itabela.sipi-dt-itabela.workers.dev/sipi-badge.png" alt="">' +
          "<div>" +
          '<p class="rel-orgao">Polícia Civil da Bahia</p>' +
          "<h1>Relatório Comparativo de CVLI</h1>" +
          "<p>Crimes violentos letais intencionais — registros e elucidações</p>" +
          "<small>Delegacia Territorial de Itabela</small>" +
          "</div>" +
          '<div class="rel-id"><span>Período</span><strong>' + escapar(periodo) +
          "</strong><small>Emitido em " + escapar(payload.atualizadoEm) + "</small></div>" +
          "</header>" +
          '<div class="rel-faixa"><span>Documento operacional</span><strong>Uso interno e restrito</strong></div>' +
          "<h2>Resumo do período</h2>" +
          '<div class="rel-cartoes">' + cartoes + "</div>" +
          '<section class="rel-texto">' +
          "<h2>Leitura do período</h2>" +
          "<p>" +
          escapar(
            "No período de " + periodo + " a unidade registrou " + totalRegistros +
            " crimes violentos letais intencionais, dos quais " + totalElucidados +
            " foram elucidados, o que corresponde a uma taxa geral de " + taxaGeral + "%."
          ) +
          "</p>" + paragrafos + "</section>" +
          '<div class="rel-assinatura">Delegado(a) de Polícia</div>' +
          '<section class="rel-folha2"><h2>Quadro comparativo</h2>' + tabelaHtml +
          '<p class="legenda">Registros e elucidações por mês, conforme a aba Dashborads CVLI. ' +
          "Emitido em " + escapar(payload.atualizadoEm) + ".</p></section>";
      }

      function falhar(error) {
        const alvo = document.getElementById("content");
        alvo.className = "aviso erro";
        alvo.textContent =
          error && error.message ? error.message : "Não foi possível carregar o dashboard.";
        document.getElementById("refresh").disabled = false;
      }

      function carregar() {
        document.getElementById("refresh").disabled = true;
        google.script.run.withSuccessHandler(renderizar).withFailureHandler(falhar).obterDashboardCvli();
      }

      carregar();
    </script>
  </body>
</html>
