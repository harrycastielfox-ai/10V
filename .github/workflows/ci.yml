name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Isolated PostgreSQL migration integration
        run: pnpm run test:integration

      - name: Migration comparison tooling
        run: pnpm run test:migrations

      - name: Recovered database baseline and runtime checks
        run: pnpm run test:schema

      - name: Schema catalog parity tooling
        run: pnpm run test:schema-parity

      - name: Isolated full-stack E2E safety tooling
        run: pnpm run test:e2e:local-tools

      - name: Production build
        run: pnpm run build

      - name: Bundle budgets
        run: pnpm run test:bundle

      - name: Install Chromium for E2E smoke tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Isolated Supabase full-stack E2E
        run: pnpm run test:e2e:fullstack

      - name: E2E smoke tests
        run: pnpm run test:e2e
